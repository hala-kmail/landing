<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The tab icon: the same tile the rail draws, with the same `i` inside it.

    Hard-coded lime because a favicon is painted before the app has loaded and
    has no access to the palette tokens. These are the default theme's primary
    and primary-foreground, which is the pair a first-time visitor sees anyway.

    The mark is the drawing from `components/brand/prism.tsx`, in its own
    coordinates, moved into the tile by the transform rather than re-measured.
  -->
  <rect width="32" height="32" rx="9" fill="#c4ec3e" />
  <g transform="translate(16 16) scale(0.145) translate(-12 -60)" fill="#15180f">
    <circle cx="12" cy="12" r="36" fill="url(#halo)" />
    <circle cx="12" cy="12" r="12" />
    <rect x="4.62" y="48.1" width="14.76" height="71.9" />
  </g>
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#15180f" stop-opacity="0.38" />
      <stop offset="0.36" stop-color="#15180f" stop-opacity="0.36" />
      <stop offset="0.55" stop-color="#15180f" stop-opacity="0.23" />
      <stop offset="0.75" stop-color="#15180f" stop-opacity="0.12" />
      <stop offset="1" stop-color="#15180f" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>
